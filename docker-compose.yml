
services:
  employee-mysql:
    image: mysql:8.4
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: employee_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  employee-app:
    image: employee-management-system:latest
    container_name: employee-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://employee-mysql:3306/employee_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      employee-mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
    external: true
    name: dd86cb87af346cfd1b4dee9c500517a397bf665cd473f0e74c512382890429c3
